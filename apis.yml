aid: carta-healthcare
name: Carta Healthcare
description: 'Carta Healthcare, Inc. is a San Francisco based clinical data management
  company that applies a "Hybrid Intelligence" model — proprietary AI paired with certified
  human clinical abstractors — to extract, validate and submit structured clinical data
  on behalf of hospitals and health systems. Its product family covers Voyager (the
  underlying AI data platform trained on electronic medical record content), Lighthouse
  and Atlas (AI-assisted clinical registry abstraction and submission, including the
  ACC NCDR, STS/ACC TVT and Vascular Quality Initiative registries), Navigator (clinical
  data intelligence and analytics), Harbor (cohort selection and clinical trial matching)
  and outsourced expert abstraction services. Carta Healthcare is an NCDR certified
  software vendor and has completed a Type 2 SOC 2 examination with an unqualified
  opinion covering security, availability and confidentiality. The company sells and
  integrates directly with hospital EMR environments under enterprise agreements; it
  publishes no public developer program, API documentation, or machine-readable API
  contract on its public web surface.'
